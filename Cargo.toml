[package]
name = "hexa-fm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Six-operator FM synthesizer with a sound library (a redesign of AV Dexed, based on DEXED)"

[lib]
name = "hexa_fm"
path = "src/lib.rs"

[[bin]]
name = "hexa-fm"
path = "src/main.rs"

[dependencies]
egui = "0.31"
cpal = "0.15"
dirs = "7.0.0"
eframe = { version = "0.31", features = ["default"] }
image = { version = "0.25", default-features = false, features = ["png"] }
midir = "0.10"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[workspace]
members = [".", "plugin", "xtask", "win-installer"]
default-members = ["."]
resolver = "2"
